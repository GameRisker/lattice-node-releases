name: DeepSeek Windows reviewed release
on:
  workflow_dispatch:
    inputs:
      release_workflow_sha:
        description: Reviewed current main SHA of THIS public repository
        required: true
        type: string
      source_sha:
        description: Reviewed private main source SHA
        required: true
        type: string
      source_run_id:
        description: Successful private unsigned-build run ID (first attempt)
        required: true
        type: string
      artifact_id:
        description: Exact private unsigned artifact ID
        required: true
        type: string
      artifact_sha256:
        description: GitHub uploaded artifact archive SHA256
        required: true
        type: string
      installer_sha256:
        description: Reviewed install.ps1 SHA256 from private build summary
        required: true
        type: string
      release_tag:
        description: New vYYYY.MM.DD-deepseek-windows-selfuseN tag
        required: true
        type: string
      publish:
        description: Request approved PUBLIC artifact staging then separate final Release approval
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deepseek-windows-selfuse-release
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ inputs.source_sha }}
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  ARTIFACT_ID: ${{ inputs.artifact_id }}
  ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
  INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  REVIEWED_WORKFLOW_SHA: ${{ inputs.release_workflow_sha }}
  PUBLIC_KEY_SHA256: ${{ vars.DEEPSEEK_WINDOWS_SELFUSE_PUBLIC_KEY_SHA256 }}
  GOTOOLCHAIN: local
jobs:
  sign:
    if: github.repository == 'GameRisker/lattice-node-releases' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # main-only + owner reviewer BEFORE secrets. With publish=true, approval also
    # authorizes PUBLIC artifact staging; the later gate only controls final Release.
    environment: deepseek-windows-sign
    outputs:
      package_id: ${{ steps.package.outputs.artifact-id }}
      package_digest: ${{ steps.package.outputs.artifact-digest }}
    steps:
      - name: Validate approved immutable context
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$REVIEWED_WORKFLOW_SHA" = "$GITHUB_SHA"
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$INSTALLER_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$PUBLIC_KEY_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}-deepseek-windows-selfuse[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.0'
          cache: false
      - name: Test and build trusted public tools, never downloaded programs
        run: |
          set -euo pipefail
          python -m unittest discover -s scripts -p 'test_*.py' -v
          cd signer
          go test ./...
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/signer" .
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: reader
        with:
          app-id: ${{ vars.LATTICE_ARTIFACT_READER_APP_ID }}
          private-key: ${{ secrets.LATTICE_ARTIFACT_READER_APP_PRIVATE_KEY }}
          owner: GameRisker
          repositories: lattice
          permission-actions: read
      - name: Fetch exact source artifact as DATA, without executing or extracting it
        env:
          GH_TOKEN: ${{ steps.reader.outputs.token }}
        run: |
          set -euo pipefail
          python scripts/fetch.py --run-id "$SOURCE_RUN_ID" --artifact-id "$ARTIFACT_ID" --source-sha "$SOURCE_SHA" --artifact-sha256 "$ARTIFACT_SHA256" --out "$RUNNER_TEMP/unsigned.zip"
      - name: Sign approved bytes with independent self-use key
        env:
          SIGNING_KEY: ${{ secrets.DEEPSEEK_WINDOWS_SELFUSE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          keydir=$(mktemp -d "$RUNNER_TEMP/signing.XXXXXX")
          trap 'rm -rf -- "$keydir"' EXIT
          test -n "$SIGNING_KEY"
          printf '%s' "$SIGNING_KEY" > "$keydir/key.pem"
          unset SIGNING_KEY
          "$RUNNER_TEMP/signer" --archive "$RUNNER_TEMP/unsigned.zip" --archive-sha256 "$ARTIFACT_SHA256" --installer-sha256 "$INSTALLER_SHA256" --key "$keydir/key.pem" --public-key-sha256 "$PUBLIC_KEY_SHA256" --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --source-run-id "$SOURCE_RUN_ID" --out "$RUNNER_TEMP/signed"
          echo 'Signature/package checks passed. Full install, Harness, pairing, startup and model inference NOT_RUN.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: package
        if: inputs.publish
        with:
          name: deepseek-windows-signed-${{ github.run_id }}
          path: ${{ runner.temp }}/signed/*
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
  publish:
    needs: sign
    if: inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Separate owner approval. Do NOT store either private key in this environment.
    environment: deepseek-windows-publish
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.25.0'
          cache: false
      - name: Build trusted verifier
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$REVIEWED_WORKFLOW_SHA" = "$GITHUB_SHA"
          cd signer
          go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/signer" .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.sign.outputs.package_id }}
          path: ${{ runner.temp }}/signed
          merge-multiple: true
      - name: Verify signatures and exact inventory, then publish new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/signer" --verify-dir "$RUNNER_TEMP/signed" --archive-sha256 "$ARTIFACT_SHA256" --installer-sha256 "$INSTALLER_SHA256" --public-key-sha256 "$PUBLIC_KEY_SHA256" --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --source-run-id "$SOURCE_RUN_ID"
          python scripts/publish.py --dir "$RUNNER_TEMP/signed" --tag "$RELEASE_TAG" --source-sha "$SOURCE_SHA" --workflow-sha "$REVIEWED_WORKFLOW_SHA"
